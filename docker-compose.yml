services:

  backend1:
    build: ./backend
    container_name: backend1
    environment:
      SERVER_NAME: Backend-1
      PORT: 3000

  backend2:
    build: ./backend
    container_name: backend2
    environment:
      SERVER_NAME: Backend-2
      PORT: 3000

  backend3:
    build: ./backend
    container_name: backend3
    environment:
      SERVER_NAME: Backend-3
      PORT: 3000

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3